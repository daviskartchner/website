<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.1);
            --button-bg: #3498db;
            --button-hover: #2980b9;
            --save-button-bg: #2ecc71;
            --save-button-hover: #27ae60;
            --error-bg: #fdeaea;
            --error-color: #e74c3c;
            --version-bg: #f8f9fa;
            --version-color: #95a5a6;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme='light']) {
                --bg-color: #1a1a1a;
                --container-bg: #2d2d2d;
                --text-color: #e0e0e0;
                --border-color: #404040;
                --input-bg: #363636;
                --shadow-color: rgba(0,0,0,0.3);
                --button-bg: #2980b9;
                --button-hover: #3498db;
                --save-button-bg: #27ae60;
                --save-button-hover: #2ecc71;
                --error-bg: #482c2c;
                --error-color: #e74c3c;
                --version-bg: #363636;
                --version-color: #95a5a6;
            }
        }

        [data-theme='dark'] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --border-color: #404040;
            --input-bg: #363636;
            --shadow-color: rgba(0,0,0,0.3);
            --button-bg: #2980b9;
            --button-hover: #3498db;
            --save-button-bg: #27ae60;
            --save-button-hover: #2ecc71;
            --error-bg: #482c2c;
            --error-color: #e74c3c;
            --version-bg: #363636;
            --version-color: #95a5a6;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px var(--shadow-color);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .input-group {
            margin-bottom: 25px;
            max-width: 100%;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--button-bg);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 0.7rem top 50%;
            background-size: 0.65rem auto;
            padding-right: 2rem;
            box-sizing: border-box;
        }
        .select-wrapper {
            position: relative;
            display: inline-block;
            min-width: 200px;
            max-width: 100%;
        }
        #qrcode-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 auto;
        }
        #qrcode, #directQrcode {
            text-align: center;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            display: none;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1;
            width: fit-content;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 25px 0;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            background-color: var(--button-bg);
            color: white;
        }
        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            background-color: var(--error-bg);
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fadbd8;
        }
        #gui, #direct {
            display: none;
        }
        .usage {
            background-color: var(--version-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-family: monospace;
            border: 1px solid #e0e0e0;
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.4;
        }
        .regenerate-controls {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin: 25px 0;
            border: 1px solid #e0e0e0;
        }
        .regenerate-controls input, .regenerate-controls select {
            margin-bottom: 15px;
        }
        canvas, img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
        .version {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #95a5a6;
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
        }
        .version-container {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }
        .theme-toggle {
            display: none;
            font-size: 12px;
            margin-top: 5px;
            color: #95a5a6;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .version-container:hover .theme-toggle {
            display: block;
        }
        .theme-toggle:hover {
            background-color: #f8f9fa;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }

            .controls {
                gap: 10px;
            }

            .select-wrapper {
                min-width: unset;
                width: 100%;
            }

            input[type="text"], select {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .usage {
                font-size: 12px;
                padding: 10px;
                word-break: break-all;
            }

            #qrcode, #directQrcode {
                padding: 15px;
                margin: 20px auto;
            }

            .button-group button {
                width: 100%;
                margin: 5px 0;
            }
        }
        /* Theme Toggle Switch */
        .theme-switch-wrapper {
            position: absolute;
            top: 10px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--version-bg);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--version-bg);
            border: 1px solid var(--border-color);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 3px;
            background-color: var(--text-color);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .theme-icon {
            font-size: 14px;
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            .theme-switch-wrapper {
                right: 10px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body.system-theme {
                background-color: #1a1a1a;
                color: #ffffff;
            }

            body.system-theme .container {
                background-color: #2d2d2d;
                box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            }

            body.system-theme input[type="text"],
            body.system-theme select {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
                color: #ffffff;
            }

            body.system-theme .usage,
            body.system-theme .regenerate-controls {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
            }

            body.system-theme .version {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
                color: #95a5a6;
            }

            body.system-theme .theme-toggle:hover {
                background-color: #3d3d3d;
            }

            body.system-theme select {
                background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            }
        }

        /* Dark theme classes for manual toggle */
        body.dark-theme {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        body.dark-theme .container {
            background-color: #2d2d2d;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        }

        body.dark-theme input[type="text"],
        body.dark-theme select {
            background-color: #3d3d3d;
            border-color: #4d4d4d;
            color: #ffffff;
        }

        body.dark-theme .usage,
        body.dark-theme .regenerate-controls {
            background-color: #3d3d3d;
            border-color: #4d4d4d;
        }

        body.dark-theme .version {
            background-color: #3d3d3d;
            border-color: #4d4d4d;
            color: #95a5a6;
        }

        body.dark-theme .theme-toggle:hover {
            background-color: #3d3d3d;
        }

        body.dark-theme select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        }
    </style>
</head>
<body class="system-theme">
    <div class="version-container">
        <div class="version">v1.5.6</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
    </div>
    <div id="gui" class="container">
        <h1>QR Code Generator</h1>
        
        <div class="usage">
            Direct URL usage: ?data=Hello%20World&size=400&type=png
        </div>

        <div class="error" id="errorMsg"></div>

        <div class="input-group">
            <label for="data">Text or URL:</label>
            <input type="text" id="data" placeholder="Enter text or URL to encode" 
                onkeyup="generateQR()" 
                onpaste="setTimeout(generateQR, 0)">
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="size">Size (px):</label>
                <div class="select-wrapper">
                    <select id="size" onchange="generateQR()">
                        <option value="200">200 x 200</option>
                        <option value="300">300 x 300</option>
                        <option value="400" selected>400 x 400</option>
                        <option value="500">500 x 500</option>
                        <option value="600">600 x 600</option>
                        <option value="800">800 x 800</option>
                        <option value="1000">1000 x 1000</option>
                        <option value="1200">1200 x 1200</option>
                        <option value="1500">1500 x 1500</option>
                        <option value="2000">2000 x 2000</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="format">Format:</label>
                <div class="select-wrapper">
                    <select id="format" onchange="generateQR()">
                        <option value="png">PNG Image</option>
                        <option value="svg">SVG Vector</option>
                        <option value="jpg">JPG Image</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button id="saveBtn" onclick="saveQR()" disabled>Save</button>
        </div>

        <div id="qrcode"></div>
    </div>

    <div id="direct" class="container">
        <div class="regenerate-controls">
            <label for="newData">New Text/URL:</label>
            <input type="text" id="newData" placeholder="Enter new text or URL" onkeypress="if(event.key === 'Enter') regenerateQR()">
            
            <label for="newSize">Size (px):</label>
            <div class="select-wrapper">
                <select id="newSize">
                    <option value="200">200 x 200</option>
                    <option value="300">300 x 300</option>
                    <option value="400" selected>400 x 400</option>
                    <option value="500">500 x 500</option>
                    <option value="600">600 x 600</option>
                    <option value="800">800 x 800</option>
                    <option value="1000">1000 x 1000</option>
                    <option value="1200">1200 x 1200</option>
                    <option value="1500">1500 x 1500</option>
                    <option value="2000">2000 x 2000</option>
                </select>
            </div>
            
            <label for="newFormat">Format:</label>
            <div class="select-wrapper">
                <select id="newFormat">
                    <option value="png">PNG Image</option>
                    <option value="svg">SVG Vector</option>
                    <option value="jpg">JPG Image</option>
                </select>
            </div>
            
            <div class="button-group">
                <button onclick="regenerateQR()">Regenerate</button>
                <button onclick="downloadQR()">Download</button>
            </div>
        </div>
        <div id="directQrcode"></div>
    </div>

    <script>
        let currentQR = null;
        let currentTheme = 'system';

        // Initialize theme
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                currentTheme = savedTheme;
                document.body.className = savedTheme === 'system' ? 'system-theme' : savedTheme + '-theme';
            }
        }

        // Toggle between light, dark, and system themes
        function toggleTheme() {
            const themes = ['system', 'light', 'dark'];
            const currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];
            
            localStorage.setItem('theme', currentTheme);
            
            if (currentTheme === 'system') {
                document.body.className = 'system-theme';
            } else {
                document.body.className = currentTheme + '-theme';
            }
        }

        // Initialize theme when page loads
        window.addEventListener('load', initializeTheme);

        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function validateSize(size) {
            return size >= 200 && size <= 2000;
        }

        function generateQR(directMode = false) {
            let data, size, format;
            
            if (directMode) {
                const urlParams = new URLSearchParams(window.location.search);
                data = urlParams.get('data');
                size = parseInt(urlParams.get('size')) || 400;
                format = urlParams.get('type') || 'png';
            } else {
                data = document.getElementById('data').value.trim();
                size = parseInt(document.getElementById('size').value);
                format = document.getElementById('format').value;
            }
            
            const qrcodeEl = directMode ? document.getElementById('directQrcode') : document.getElementById('qrcode');
            const saveBtn = document.getElementById('saveBtn');

            // Clear previous QR code and handle empty input
            qrcodeEl.innerHTML = '';
            if (!data) {
                qrcodeEl.style.display = 'none';
                saveBtn.disabled = true;
                return;
            }

            // Show QR code container
            qrcodeEl.style.display = 'flex';

            if (!validateSize(size)) {
                if (!directMode) showError('Size must be between 200 and 2000 pixels');
                return;
            }

            try {
                const options = {
                    text: data,
                    width: size,
                    height: size,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L,
                    margin: 4
                };

                // Create a container for the QR code
                const qrContainer = document.createElement('div');
                qrContainer.id = 'qrcode-container';
                qrcodeEl.appendChild(qrContainer);

                // Generate QR code
                if (format === 'svg') {
                    const qr = new QRCode(qrContainer, {
                        ...options,
                        useSVG: true
                    });
                    
                    setTimeout(() => {
                        const svg = qrContainer.querySelector('svg');
                        if (svg) {
                            // Add margin to SVG
                            const existingSvg = svg.outerHTML;
                            const wrappedSvg = `<div style="background:white;padding:30px;display:inline-block;">${existingSvg}</div>`;
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = wrappedSvg;
                            
                            currentQR = {
                                data: 'data:image/svg+xml;base64,' + btoa(tempDiv.innerHTML),
                                format: 'svg'
                            };
                            if (!directMode) saveBtn.disabled = false;
                        }
                    }, 100);
                } else {
                    const qr = new QRCode(qrContainer, options);
                    
                    setTimeout(() => {
                        const canvas = qrContainer.querySelector('canvas');
                        if (canvas) {
                            // Create a new canvas with margin
                            const newCanvas = document.createElement('canvas');
                            const margin = 30;
                            newCanvas.width = canvas.width + (margin * 2);
                            newCanvas.height = canvas.height + (margin * 2);
                            const ctx = newCanvas.getContext('2d');
                            
                            // Fill with white background
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                            
                            // Draw original QR code
                            ctx.drawImage(canvas, margin, margin);
                            
                            currentQR = {
                                data: newCanvas.toDataURL(`image/${format}`),
                                format: format
                            };
                            if (!directMode) saveBtn.disabled = false;
                        }
                    }, 100);
                }
            } catch (error) {
                if (!directMode) showError('Error generating QR code: ' + error.message);
            }
        }

        function regenerateQR() {
            const data = document.getElementById('newData').value.trim();
            const size = document.getElementById('newSize').value;
            const format = document.getElementById('newFormat').value;
            
            // Update URL without reloading
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('data', data);
            newUrl.searchParams.set('size', size);
            newUrl.searchParams.set('type', format);
            window.history.pushState({}, '', newUrl);
            
            generateQR(true);
        }

        function downloadQR() {
            if (!currentQR) return;
            
            const format = document.getElementById('newFormat').value;
            const data = document.getElementById('newData').value.trim() || new URLSearchParams(window.location.search).get('data');
            const filename = `qrcode-${data.substring(0, 30)}.${currentQR.format}`;

            const link = document.createElement('a');
            link.href = currentQR.data;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function saveQR() {
            if (!currentQR) {
                showError('Please generate a QR code first');
                return;
            }

            const format = document.getElementById('format').value;
            const data = document.getElementById('data').value.trim();
            const filename = `qrcode-${data.substring(0, 30)}.${currentQR.format}`;

            const link = document.createElement('a');
            link.href = currentQR.data;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize page
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');
            
            if (data) {
                // Direct QR code mode
                document.getElementById('direct').style.display = 'block';
                document.getElementById('gui').style.display = 'none';
                document.getElementById('newData').value = data;
                document.getElementById('newSize').value = urlParams.get('size') || 400;
                document.getElementById('newFormat').value = urlParams.get('type') || 'png';
                generateQR(true);
            } else {
                // GUI mode
                document.getElementById('gui').style.display = 'block';
                document.getElementById('direct').style.display = 'none';
            }
        };
    </script>
</body>
</html>
