<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
        }
        #qrcode {
            text-align: center;
        }
        .error {
            color: red;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="qrcode"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const data = urlParams.get('data');
        const type = urlParams.get('type') || 'svg';

        if (!data) {
            document.getElementById('qrcode').innerHTML = '<div class="error">Error: No data parameter provided.<br>Example usage: ?data=Hello%20World&type=png</div>';
        } else {
            const qrcodeElement = document.getElementById('qrcode');
            const options = {
                width: 400,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            };
            
            try {
                switch (type.toLowerCase()) {
                    case 'png':
                        QRCode.toCanvas(qrcodeElement, data, options, function (error) {
                            if (error) {
                                qrcodeElement.innerHTML = '<div class="error">Error: ' + error + '</div>';
                            }
                        });
                        break;
                        
                    case 'url':
                        QRCode.toDataURL(data, options, function (err, url) {
                            if (err) {
                                qrcodeElement.innerHTML = '<div class="error">Error: ' + err + '</div>';
                            } else {
                                // Return only the data URL
                                document.write(url);
                            }
                        });
                        break;
                        
                    case 'svg':
                    default:
                        QRCode.toString(data, { ...options, type: 'svg' }, function (error, string) {
                            if (error) {
                                qrcodeElement.innerHTML = '<div class="error">Error: ' + error + '</div>';
                            } else {
                                // Return only the SVG
                                document.write(string);
                            }
                        });
                        break;
                }
            } catch (error) {
                qrcodeElement.innerHTML = '<div class="error">Error: ' + error + '</div>';
            }
        }
    </script>
</body>
</html>
