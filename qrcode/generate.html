<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script>
        // Early theme initialization to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            let theme;
            if (savedTheme) {
                theme = savedTheme;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            } else {
                theme = 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.className = theme + '-theme';
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        /* Light theme variables */
        :root,
        :root[data-theme='light'] {
            --bg-color: #f5f5f5;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.1);
            --button-bg: #3498db;
            --button-hover: #2980b9;
            --save-button-bg: #2ecc71;
            --save-button-hover: #27ae60;
            --error-bg: #fdeaea;
            --error-color: #e74c3c;
            --version-bg: #f8f9fa;
            --version-color: #95a5a6;
            --label-color: #2c3e50;
        }

        /* Dark theme variables */
        :root[data-theme='dark'] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --border-color: #404040;
            --input-bg: #363636;
            --shadow-color: rgba(0,0,0,0.3);
            --button-bg: #2980b9;
            --button-hover: #3498db;
            --save-button-bg: #27ae60;
            --save-button-hover: #2ecc71;
            --error-bg: #482c2c;
            --error-color: #e74c3c;
            --version-bg: #363636;
            --version-color: #95a5a6;
            --label-color: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px var(--shadow-color);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--label-color);
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .input-group {
            margin-bottom: 25px;
            max-width: 100%;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--label-color);
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--button-bg);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 0.7rem top 50%;
            background-size: 0.65rem auto;
            padding-right: 2rem;
            box-sizing: border-box;
        }
        .select-wrapper {
            position: relative;
            display: inline-block;
            min-width: 200px;
            max-width: 100%;
        }
        #qrcode-container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 auto;
        }
        #qrcode, #directQrcode {
            text-align: center;
            margin: 30px auto;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            display: none;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1;
            width: fit-content;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 25px 0;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            background-color: var(--button-bg);
            color: white;
        }
        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            background-color: var(--error-bg);
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fadbd8;
        }
        #gui, #direct {
            display: none;
        }
        .usage {
            background-color: var(--version-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-family: monospace;
            border: 1px solid #e0e0e0;
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.4;
        }
        .regenerate-controls {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin: 25px 0;
            border: 1px solid #e0e0e0;
        }
        .regenerate-controls input, .regenerate-controls select {
            margin-bottom: 15px;
        }
        canvas, img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
        .version-container {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }
        .version {
            font-size: 12px;
            color: var(--version-color);
            font-family: monospace;
            background-color: var(--version-bg);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            width: fit-content;
            margin-left: auto;
        }
        .theme-toggle {
            display: block;
            font-size: 12px;
            color: var(--text-color);
            background-color: var(--version-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            width: fit-content;
            margin-left: auto;
            white-space: nowrap;
        }
        .version-container:hover .theme-toggle {
            opacity: 1;
            visibility: visible;
        }
        .theme-toggle:hover {
            background-color: var(--button-bg);
            color: white;
        }
        /* Add hover area */
        .version-container::after {
            content: '';
            position: absolute;
            top: -10px;
            right: -10px;
            bottom: -10px;
            left: -10px;
            z-index: -1;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }

            .controls {
                gap: 10px;
            }

            .select-wrapper {
                min-width: unset;
                width: 100%;
            }

            input[type="text"], select {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .usage {
                font-size: 12px;
                padding: 10px;
                word-break: break-all;
            }

            #qrcode, #directQrcode {
                padding: 15px;
                margin: 20px auto;
            }

            .button-group button {
                width: 100%;
                margin: 5px 0;
            }
        }
        /* Theme Toggle Switch */
        .theme-switch-wrapper {
            position: absolute;
            top: 10px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--version-bg);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--version-bg);
            border: 1px solid var(--border-color);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 3px;
            background-color: var(--text-color);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .theme-icon {
            font-size: 14px;
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            .theme-switch-wrapper {
                right: 10px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body.system-theme {
                background-color: #1a1a1a;
                color: #ffffff;
            }

            body.system-theme .container {
                background-color: #2d2d2d;
                box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            }

            body.system-theme input[type="text"],
            body.system-theme select {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
                color: #ffffff;
            }

            body.system-theme .usage,
            body.system-theme .regenerate-controls {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
            }

            body.system-theme .version {
                background-color: #3d3d3d;
                border-color: #4d4d4d;
                color: #95a5a6;
            }

            body.system-theme .theme-toggle:hover {
                background-color: #3d3d3d;
            }

            body.system-theme select {
                background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            }
        }

        /* Dark theme classes for manual toggle */
        body.dark-theme {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body.dark-theme .container {
            background-color: var(--container-bg);
            box-shadow: 0 2px 15px var(--shadow-color);
        }

        body.dark-theme input[type="text"],
        body.dark-theme input[type="number"],
        body.dark-theme select {
            background-color: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }

        body.dark-theme .usage,
        body.dark-theme .regenerate-controls {
            background-color: var(--version-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }

        body.dark-theme .version,
        body.dark-theme .theme-toggle {
            background-color: var(--version-bg);
            border-color: var(--border-color);
            color: var(--version-color);
        }

        body.dark-theme h1,
        body.dark-theme label {
            color: var(--label-color);
        }

        body.dark-theme select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        }

        .advanced-toggle {
            color: var(--text-color);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .advanced-toggle:hover {
            opacity: 1;
        }

        .advanced-toggle::before {
            content: '▸';
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .advanced-toggle.open::before {
            transform: rotate(90deg);
        }

        .advanced-section {
            display: none;
            padding: 15px;
            background-color: var(--version-bg);
            border-radius: 8px;
            margin: 10px 0 25px;
            border: 1px solid var(--border-color);
        }

        .advanced-section.visible {
            display: block;
        }

        .advanced-section .input-group {
            margin-bottom: 15px;
        }

        .advanced-section .input-group:last-child {
            margin-bottom: 0;
        }

        /* Add tooltip styles */
        .tooltip-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .tooltip-icon {
            margin-left: 5px;
            cursor: help;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .tooltip-icon:hover {
            opacity: 1;
        }

        .tooltip-text {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--container-bg);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 1px solid var(--border-color);
            width: 200px;
            display: none;
            z-index: 100;
        }

        .tooltip-wrapper:hover .tooltip-text {
            display: block;
        }
    </style>
</head>
<body>
    <div class="version-container">
        <div class="version">v1.6.0</div>
        <button class="theme-toggle" onclick="toggleTheme()">☀️ Light Theme</button>
    </div>
    <div id="gui" class="container">
        <h1>QR Code Generator</h1>

        <div class="error" id="errorMsg"></div>

        <div class="input-group">
            <label for="data">Text or URL:</label>
            <input type="text" id="data" placeholder="Enter text or URL to encode" 
                onkeyup="generateQR()" 
                onpaste="setTimeout(generateQR, 0)">
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="size">Size (px):</label>
                <div class="select-wrapper">
                    <select id="size" onchange="generateQR()">
                        <option value="200">200 x 200</option>
                        <option value="300">300 x 300</option>
                        <option value="400" selected>400 x 400</option>
                        <option value="500">500 x 500</option>
                        <option value="600">600 x 600</option>
                        <option value="800">800 x 800</option>
                        <option value="1000">1000 x 1000</option>
                        <option value="1200">1200 x 1200</option>
                        <option value="1500">1500 x 1500</option>
                        <option value="2000">2000 x 2000</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="format">Format:</label>
                <div class="select-wrapper">
                    <select id="format" onchange="generateQR()">
                        <option value="png" selected>PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="svg">SVG</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="advanced-toggle" onclick="toggleAdvanced(this)">Advanced Options</button>
        
        <div class="advanced-section" id="advancedSection">
            <div class="input-group">
                <div class="tooltip-wrapper">
                    <label for="errorCorrection">Error Correction:</label>
                    <span class="tooltip-icon">ⓘ</span>
                    <div class="tooltip-text">Higher levels allow QR code to remain readable even when partially damaged or obscured, but increase QR code size.</div>
                </div>
                <div class="select-wrapper">
                    <select id="errorCorrection" onchange="generateQR()">
                        <option value="L">Low (7%)</option>
                        <option value="M">Medium (15%)</option>
                        <option value="Q">Quartile (25%)</option>
                        <option value="H">High (30%)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="tooltip-wrapper">
                    <label for="quietZone">Quiet Zone (margin):</label>
                    <span class="tooltip-icon">ⓘ</span>
                    <div class="tooltip-text">White space around the QR code. Minimum of 4 modules recommended for reliable scanning.</div>
                </div>
                <div class="select-wrapper">
                    <select id="quietZone" onchange="generateQR()">
                        <option value="0">None</option>
                        <option value="1">1 module</option>
                        <option value="2">2 modules</option>
                        <option value="3">3 modules</option>
                        <option value="4" selected>4 modules (recommended)</option>
                        <option value="6">6 modules</option>
                        <option value="8">8 modules</option>
                        <option value="10">10 modules</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button id="saveBtn" onclick="saveQR()" disabled>Save</button>
        </div>

        <div id="qrcode"></div>
    </div>

    <div id="direct">
        <div id="directQrcode"></div>
    </div>

    <script>
        let currentQR = null;
        let currentTheme = null;

        // Initialize theme
        function initializeTheme() {
            // Only initialize theme for GUI mode
            if (!window.location.search) {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    currentTheme = savedTheme;
                } else {
                    // Default to system preference
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        currentTheme = 'dark';
                    } else {
                        currentTheme = 'light';
                    }
                }
                
                // Listen for system theme changes if no manual preference is set
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('theme')) {
                        currentTheme = e.matches ? 'dark' : 'light';
                        applyTheme(currentTheme);
                        updateToggleButton();
                    }
                });
            }
        }

        // Apply theme to document
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            updateToggleButton();
        }

        // Update toggle button text
        function updateToggleButton() {
            if (!window.location.search) {
                const themeEmoji = {
                    'light': '☀️',
                    'dark': '🌙'
                };
                const themeNames = {
                    'light': 'Light',
                    'dark': 'Dark'
                };
                const toggleBtn = document.querySelector('.theme-toggle');
                toggleBtn.textContent = `${themeEmoji[currentTheme]} ${themeNames[currentTheme]} Theme`;
            }
        }

        // Toggle between light and dark themes
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
            updateToggleButton();
        }

        // Initialize page
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');
            
            if (data) {
                // Direct QR code mode - minimal display
                document.body.style.margin = '0';
                document.body.style.padding = '0';
                document.body.style.background = 'none';
                document.getElementById('direct').style.display = 'block';
                document.getElementById('gui').style.display = 'none';
                document.querySelector('.version-container').style.display = 'none';
                generateQR(true);
            } else {
                // GUI mode
                document.getElementById('gui').style.display = 'block';
                document.getElementById('direct').style.display = 'none';
                initializeTheme();
                updateToggleButton();
            }
        };

        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function validateSize(size) {
            return size >= 200 && size <= 2000;
        }

        function toggleAdvanced(button) {
            button.classList.toggle('open');
            document.getElementById('advancedSection').classList.toggle('visible');
        }

        function generateQR(directMode = false) {
            let data, size, format;
            
            if (directMode) {
                const urlParams = new URLSearchParams(window.location.search);
                data = urlParams.get('data');
                size = parseInt(urlParams.get('size')) || 400;
                format = urlParams.get('type') || 'png';
            } else {
                data = document.getElementById('data').value.trim();
                size = parseInt(document.getElementById('size').value);
                format = document.getElementById('format').value;
            }
            
            const qrcodeEl = directMode ? document.getElementById('directQrcode') : document.getElementById('qrcode');
            const saveBtn = document.getElementById('saveBtn');

            // Clear previous QR code and handle empty input
            qrcodeEl.innerHTML = '';
            if (!data) {
                qrcodeEl.style.display = 'none';
                if (!directMode) saveBtn.disabled = true;
                return;
            }

            // Show QR code container
            qrcodeEl.style.display = 'flex';

            if (!validateSize(size)) {
                if (!directMode) showError('Size must be between 200 and 2000 pixels');
                return;
            }

            try {
                const errorCorrectionLevel = directMode ? 'L' : document.getElementById('errorCorrection').value;
                const quietZone = directMode ? 4 : parseInt(document.getElementById('quietZone').value);

                const options = {
                    text: data,
                    width: size,
                    height: size,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel[errorCorrectionLevel],
                    margin: quietZone
                };

                // Create a container for the QR code
                const qrContainer = document.createElement('div');
                qrContainer.id = 'qrcode-container';
                qrcodeEl.appendChild(qrContainer);

                // Generate QR code
                if (format === 'svg') {
                    const qr = new QRCode(qrContainer, {
                        ...options,
                        useSVG: true
                    });
                    
                    setTimeout(() => {
                        const svg = qrContainer.querySelector('svg');
                        if (svg) {
                            if (directMode) {
                                currentQR = {
                                    data: 'data:image/svg+xml;base64,' + btoa(svg.outerHTML),
                                    format: 'svg'
                                };
                            } else {
                                // Add margin to SVG for GUI mode
                                const existingSvg = svg.outerHTML;
                                const wrappedSvg = `<div style="background:white;padding:15px;display:inline-block;">${existingSvg}</div>`;
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = wrappedSvg;
                                
                                currentQR = {
                                    data: 'data:image/svg+xml;base64,' + btoa(tempDiv.innerHTML),
                                    format: 'svg'
                                };
                                saveBtn.disabled = false;
                            }
                        }
                    }, 100);
                } else {
                    const qr = new QRCode(qrContainer, options);
                    
                    setTimeout(() => {
                        const canvas = qrContainer.querySelector('canvas');
                        if (canvas) {
                            if (directMode) {
                                currentQR = {
                                    data: canvas.toDataURL(`image/${format}`),
                                    format: format
                                };
                            } else {
                                // Create a new canvas with margin for GUI mode
                                const newCanvas = document.createElement('canvas');
                                const margin = 15;
                                newCanvas.width = canvas.width + (margin * 2);
                                newCanvas.height = canvas.height + (margin * 2);
                                const ctx = newCanvas.getContext('2d');
                                
                                // Fill with white background
                                ctx.fillStyle = '#FFFFFF';
                                ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                                
                                // Draw original QR code
                                ctx.drawImage(canvas, margin, margin);
                                
                                currentQR = {
                                    data: newCanvas.toDataURL(`image/${format}`),
                                    format: format
                                };
                                saveBtn.disabled = false;
                            }
                        }
                    }, 100);
                }
            } catch (error) {
                if (!directMode) showError('Error generating QR code: ' + error.message);
            }
        }

        function saveQR() {
            if (!currentQR) {
                showError('Please generate a QR code first');
                return;
            }

            const format = document.getElementById('format').value;
            const data = document.getElementById('data').value.trim();
            const filename = `qrcode-${data.substring(0, 30)}.${currentQR.format}`;

            const link = document.createElement('a');
            link.href = currentQR.data;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
